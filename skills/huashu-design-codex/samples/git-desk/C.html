<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Git Field Notes — Rehearsal</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e7e5f6;color:#29243b;font:16px/1.6 Arial,sans-serif}header,main,footer{width:min(1170px,calc(100% - 60px));margin:auto}header{padding:19px 0;border-bottom:1px solid #978aa7;display:flex;align-items:center;justify-content:space-between}header img{width:67px}small{font-size:12px;font-weight:bold;letter-spacing:.10em}main{padding-top:48px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:52px}.pitch h1{margin:13px 0;font:800 clamp(45px,6.9vw,101px)/.94 Arial;letter-spacing:-.08em}.pitch p{max-width:33ch;font-size:20px}.chapters{margin-top:28px;border-top:1px solid #9e94af}.chapters button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:52px;padding:8px 10px;background:transparent;border:none;border-bottom:1px solid #9e94af;color:#29243b;font:700 16px Arial;cursor:pointer}.chapters button[aria-pressed=true]{background:#d3cbea}.chapters button:focus-visible{outline:3px solid #573ba4;outline-offset:-3px}.chapters span{color:#573ba4}.scene{align-self:start;margin-top:18px;background:#fbfbf6;padding:32px;border-radius:24px}.scene h2{font:400 46px/1 Georgia;margin:14px 0 12px;letter-spacing:-.04em}.scene p{margin:10px 0}.scene pre{margin:15px 0 6px;padding:18px 14px;background:#e4e6dc;font:15px/1.5 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.scene output{display:block;min-height:53px}.scene .advance{cursor:pointer;border:0;border-radius:4px;background:#3d275f;color:#fff;padding:12px 15px;font:700 14px Arial}.advance:focus-visible{outline:3px solid #7355b5;outline-offset:2px}footer{margin-top:55px;padding:16px 0 32px;border-top:1px solid #978aa7;font-size:13px}a{color:#4e367d}
@media(max-width:720px){header,main,footer{width:calc(100% - 36px)}main{display:block;padding-top:26px}.pitch p{font-size:17px}.chapters{margin-top:16px}.chapters button{min-height:42px}.scene{padding:20px;margin-top:20px;border-radius:12px}.scene h2{font-size:34px}footer{margin-top:20px}}
.pitch h1{font-size:84px;letter-spacing:0}.scene h2{letter-spacing:0}.scene{grid-area:scene;border-radius:8px;min-height:382px}.pitch{grid-area:pitch}.chapters{grid-area:chapters;margin:0}main{grid-template-areas:'pitch scene' 'chapters scene';row-gap:20px}
@media(max-width:1000px){.pitch h1{font-size:64px}}@media(max-width:720px){main{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:'pitch' 'scene' 'chapters';row-gap:12px}.pitch h1{font-size:47px}.scene{margin-top:0;min-height:345px}.pitch p{margin-bottom:0}}
</style></head><body><header><img src="assets/git-logo.svg" alt="Git"><small>FIELD NOTES / REHEARSAL</small></header><main>
<section class="pitch"><small>THREE STEPS / ONE NOTE</small><h1>Play it<br>through.</h1><p>Walk through a real edit and staging step. The note changes; the saved snapshot does not.</p></section>
<section class="scene" aria-label="Current rehearsal step"><small id="count"></small><h2 id="title"></h2><p id="explanation"></p><pre id="command"></pre><output id="example" aria-live="polite"></output><button class="advance" id="next">Next step</button></section>
<nav class="chapters" aria-label="Rehearsal steps"><button id="first" data-step="0" aria-pressed="true"><span>01</span> Edit on disk</button><button id="second" data-step="1" aria-pressed="false"><span>02</span> Mark the version to save</button><button id="third" data-step="2" aria-pressed="false"><span>03</span> Inspect the last commit</button></nav></main>
<footer>Real output from an isolated teaching repo. Git logo: Jason Long · <a href="https://creativecommons.org/licenses/by/3.0/">CC BY 3.0</a>.</footer><script src="fixture-data.js"></script><script>
const beats=[['Working tree','A second edit is on disk, after the first was staged.','cat field-note.txt','working'],['Staging area','Git kept the version from the last time you used git add.','git show :field-note.txt','stage'],['Last commit','No new commit was made after staging.','git show HEAD:field-note.txt','head']];
let active=0;const el=id=>document.getElementById(id),steps=document.querySelectorAll('[data-step]');function show(i){active=i;const [title,why,cmd,key]=beats[i];el('count').textContent=`STEP ${i+1} OF 3`;el('title').textContent=title;el('explanation').textContent=why;el('command').textContent=cmd;el('example').value=GIT_FIXTURE[key];el('next').textContent=i===2?'Start again':'Next step';for(const step of steps)step.setAttribute('aria-pressed',String(Number(step.dataset.step)===i))}steps.forEach(step=>step.onclick=()=>show(Number(step.dataset.step)));el('next').onclick=()=>show((active+1)%3);show(0);
</script></body></html>
