<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Git Field Notes | Pocket bench</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#142420;color:#edf1e5;font:16px/1.5 Arial,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #95442e;outline-offset:3px}[hidden]{display:none!important}
.app{width:min(100%,570px);margin:auto;min-height:100svh;background:#f6f4e8;color:#172922;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{background:#142420;color:#eff3e5;padding:22px 22px 20px;display:flex;align-items:center;gap:13px;border-bottom:4px solid #dce99d}header img{width:61px;padding:6px;background:#f6f4e8;border-radius:4px}header b{font-size:16px}header span{display:block;color:#c2d3c7;font-size:13px}main{padding:26px 22px 34px;flex:1}
h1{font:400 39px/1.1 Georgia,serif;margin:7px 0 12px;overflow-wrap:anywhere}p{margin:0 0 15px}.eyebrow{font:700 12px/1.4 ui-monospace,monospace;color:#435b4e}.status{display:inline-block;color:#263a14;background:#dce99d;padding:4px 8px;font:700 13px/1.5 ui-monospace,monospace;border-left:3px solid #617839}.list{border-top:1px solid #8a9b8c;margin:23px 0 18px}.snapshot{width:100%;border:0;border-bottom:1px solid #aeb9a5;color:inherit;background:transparent;padding:14px 0;display:grid;grid-template-columns:36px minmax(0,1fr) 20px;align-items:center;gap:8px;text-align:left;min-height:65px}.snapshot:hover,.snapshot:focus-visible{background:#e9edd6}.snapshot strong,.snapshot small{display:block}.snapshot small{font-size:14px;color:#395648}.snapshot i{font:700 13px ui-monospace,monospace;color:#4e6250}.snapshot .arrow{font-size:22px;color:#354938}.primary,.back,.switch{min-height:44px;padding:8px 13px;border:1px solid #425848;border-radius:4px;background:#f6f4e8;color:#172922;font-size:14px;font-weight:700}.primary{background:#dce99d}.back{margin-bottom:16px}.heading{margin-bottom:17px}
.sheet{padding:18px 15px;border-top:3px solid #718648;background:#ecefdc;margin:20px 0 25px}.sheet code,.diff span{font:16px/1.55 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.switcher{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 16px}.switch[aria-pressed=true]{background:#dce99d;box-shadow:inset 0 -3px #6c823d}.diff{margin:0;background:#e4e9d2;padding:14px 12px;min-height:110px;border-bottom:1px solid #aeb9a5}.diff span{display:block;color:#243e24}.diff .removed{color:#793928}
footer{padding:15px 22px 20px;border-top:1px solid #aeb9a5;display:flex;flex-wrap:wrap;gap:7px 16px;align-items:center;font-size:13px;color:#395648}footer label{font-weight:700;min-height:44px;display:flex;align-items:center;gap:8px;cursor:pointer}footer input{width:18px;height:18px;accent-color:#526d37}footer a{color:inherit}.large .sheet code,.large .diff span{font-size:20px}.large .snapshot small{font-size:17px}
</style>
<div class="app" id="app">
  <header><img src="assets/git-logo.svg" alt="Git"><div><b>Field Notes</b><span>Pocket bench</span></div></header>
  <main>
    <section id="collection">
      <span class="eyebrow">01 / SNAPSHOTS</span>
      <h1>field-note.txt</h1>
      <p class="status">MM / STAGED + EDITED</p>
      <div class="list" aria-label="File snapshots">
        <button class="snapshot" id="open-disk" data-area="working"><i>01</i><span><strong>Working tree</strong><small>On disk</small></span><span class="arrow" aria-hidden="true">›</span></button>
        <button class="snapshot" id="open-index" data-area="stage"><i>02</i><span><strong>Staging area</strong><small>In the index</small></span><span class="arrow" aria-hidden="true">›</span></button>
        <button class="snapshot" id="open-head" data-area="head"><i>03</i><span><strong>Last commit</strong><small>At HEAD</small></span><span class="arrow" aria-hidden="true">›</span></button>
      </div>
      <button class="primary" id="open-compare">Compare changes</button>
    </section>
    <section id="detail" hidden>
      <button class="back" id="back-detail">‹ Snapshots</button>
      <div class="heading"><span class="eyebrow">FIELD-NOTE.TXT</span><h1 id="detail-title"></h1></div>
      <div class="sheet"><code id="snapshot"></code></div>
    </section>
    <section id="compare" hidden>
      <button class="back" id="back-compare">‹ Snapshots</button>
      <div class="heading"><span class="eyebrow">FIELD-NOTE.TXT</span><h1>What changed</h1></div>
      <div class="switcher" aria-label="Compare against"><button class="switch" id="diff-working" data-diff="workingDiff" aria-pressed="true">Unstaged</button><button class="switch" id="diff-stage" data-diff="indexDiff" aria-pressed="false">Staged</button></div>
      <p class="eyebrow" id="diff-range"></p>
      <pre id="pocket-diff" class="diff" aria-live="polite"></pre>
    </section>
  </main>
  <footer><label><input id="larger" type="checkbox"> Larger diff text</label><a href="https://git-scm.com/downloads/logos">Git logo by Jason Long</a></footer>
</div>
<script src="fixture-data.js"></script>
<script>
const byId = id => document.getElementById(id);
const titles = {working:'Working tree',stage:'Staging area',head:'Last commit'};
let returnTo = 'open-compare';
function show(screen, focus) {
  for (const name of ['collection','detail','compare']) byId(name).hidden = name !== screen;
  byId(focus).focus({preventScroll:true});
}
for (const button of document.querySelectorAll('[data-area]')) button.addEventListener('click', () => {
  returnTo = button.id;
  const {area} = button.dataset;
  byId('detail-title').textContent = titles[area];
  byId('snapshot').textContent = GIT_FIXTURE[area];
  show('detail','back-detail');
});
byId('back-detail').onclick = () => show('collection',returnTo);
byId('open-compare').onclick = () => {setDiff('workingDiff');show('compare','back-compare')};
byId('back-compare').onclick = () => show('collection','open-compare');
function setDiff(key) {
  for (const button of document.querySelectorAll('[data-diff]')) button.setAttribute('aria-pressed',String(button.dataset.diff === key));
  byId('diff-range').textContent = key === 'indexDiff' ? 'LAST COMMIT TO INDEX' : 'INDEX TO DISK';
  byId('pocket-diff').replaceChildren(...GIT_FIXTURE[key].split('\n').filter(line => /^[+-][^+-]/.test(line)).map(line => {
    const span = document.createElement('span');
    if (line.startsWith('-')) span.className = 'removed';
    span.textContent = line;
    return span;
  }));
}
for (const button of document.querySelectorAll('[data-diff]')) {
  button.addEventListener('click', () => setDiff(button.dataset.diff));
}
const preference = byId('larger');
function displayPreference() {
  byId('app').classList.toggle('large',preference.checked);
  preference.setAttribute('aria-checked',String(preference.checked));
}
preference.checked = localStorage.getItem('pocket-text') === 'large';
preference.onchange = () => {localStorage.setItem('pocket-text',preference.checked ? 'large':'normal');displayPreference()};
displayPreference();
</script>
