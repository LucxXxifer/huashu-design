name: Check Huashu upstream and publish Codex edition

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huashu-upstream-release
  cancel-in-progress: false

jobs:
  discover:
    if: github.event.repository.fork && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      upstream: ${{ steps.release.outputs.upstream }}
      series: ${{ steps.release.outputs.series }}
      adapter: ${{ steps.release.outputs.adapter }}
      release: ${{ steps.release.outputs.release }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - name: Check out the fixed Codex source for discovery
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/huashu-design-codex-3.5
          persist-credentials: false

      - name: Resolve and verify every stable release from the adapter baseline
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import subprocess
          subprocess.run(['python3', 'scripts/discover-upstream-series.py'], check=True)

  build:
    needs: discover
    if: needs.discover.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      package_id: ${{ steps.package.outputs.artifact-id }}
    env:
      UPSTREAM_TAG: ${{ needs.discover.outputs.tag }}
      UPSTREAM_SHA: ${{ needs.discover.outputs.upstream }}
      ADAPTER_SHA: ${{ needs.discover.outputs.adapter }}
      RELEASE_SERIES: ${{ needs.discover.outputs.series }}
    steps:
      - name: Check out the fixed Codex source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.discover.outputs.adapter }}
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'

      - name: Install the Codex branch's locked dependencies
        working-directory: codex
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: Test the compatibility rules against the unmodified baseline
        env:
          HUASHU_NODE_MODULES: ${{ github.workspace }}/codex/node_modules
        run: python3 -m unittest discover -s codex/tests -p test_upstream_sync.py -v

      - name: Compare the official tag without checking out upstream code
        id: audit
        env:
          HUASHU_NODE_MODULES: ${{ github.workspace }}/codex/node_modules
          RELEASE_SERIES: ${{ needs.discover.outputs.series }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ADAPTER_SHA"
          store="$RUNNER_TEMP/huashu-upstream"
          printf '%s' "$RELEASE_SERIES" > "$RUNNER_TEMP/huashu-series.json"
          baseline=$(python3 -c 'import json; print(json.load(open("codex/upstream-policy.json"))["baseline"]["commit"])')
          first=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[0]["commit"])' "$RUNNER_TEMP/huashu-series.json")
          last=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[-1]["commit"])' "$RUNNER_TEMP/huashu-series.json")
          test "$first" = "$baseline"
          test "$last" = "$UPSTREAM_SHA"
          git init --bare --quiet "$store"
          while IFS= read -r tag_and_sha; do
            tag=${tag_and_sha%% *}
            sha=${tag_and_sha#* }
            [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
            git -C "$store" fetch --quiet --no-tags --depth=1 https://github.com/alchaincyf/huashu-design.git "+refs/tags/$tag:refs/tags/$tag"
            test "$(git -C "$store" rev-parse "refs/tags/$tag^{commit}")" = "$sha"
          done < <(python3 - "$RUNNER_TEMP/huashu-series.json" <<'PY'
          import json, sys
          for entry in json.load(open(sys.argv[1])):
              print(entry['tag'], entry['commit'])
          PY
          )
          python3 scripts/sync-upstream.py prepare-series --policy codex/upstream-policy.json \
            --candidate "$GITHUB_WORKSPACE" --upstream "$store" --series "$RUNNER_TEMP/huashu-series.json" \
            --report "$RUNNER_TEMP/huashu-audit"
          cat "$RUNNER_TEMP/huashu-audit/upstream-audit.md" >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import json,sys; print("status=" + json.load(open(sys.argv[1]))["status"])' \
            "$RUNNER_TEMP/huashu-audit/upstream-audit.json" >> "$GITHUB_OUTPUT"

      - name: Keep the per-file audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: huashu-upstream-audit-${{ needs.discover.outputs.tag }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/huashu-audit/
          if-no-files-found: warn
          retention-days: 30

      - name: Report changes that need a new adapter
        if: steps.audit.outputs.status != 'ready'
        run: |
          echo '::error::Review the changed contracts in the compatibility audit. The last verified Release remains available.'
          exit 1

      - name: Install FFmpeg and Poppler
        run: brew install ffmpeg poppler

      - name: Test all adapter outputs with the prepared candidate
        env:
          HUASHU_NODE_MODULES: ${{ github.workspace }}/codex/node_modules
        run: npm --prefix codex test

      - name: Build and check the actual download
        env:
          HUASHU_NODE_MODULES: ${{ github.workspace }}/codex/node_modules
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/huashu-dist"
          extracted="$RUNNER_TEMP/huashu-unpacked"
          python3 scripts/build-release-archive.py "$GITHUB_WORKSPACE" "$bundle"
          (cd "$bundle" && shasum -a 256 -c SHA256SUMS)
          python3 scripts/verify-release-archive.py "$bundle/huashu-design-codex.zip" "$bundle/PACKAGE-MANIFEST.json"
          unzip -q "$bundle/huashu-design-codex.zip" -d "$extracted"
          unpacked="$extracted/huashu-design-codex"
          cmp "$unpacked/runtime/package.json" codex/package.json
          cmp "$unpacked/runtime/package-lock.json" codex/package-lock.json
          HUASHU_TEST_SKILL="$unpacked/skills/huashu-design-codex" node --test --test-timeout=210000 codex/tests/mini-offline.test.cjs
          cp "$RUNNER_TEMP/huashu-audit/"upstream-audit.* "$bundle/"
          python3 - "$bundle" <<'PY'
          import json, os, pathlib, sys
          provenance = {key.lower(): os.environ[key] for key in ('UPSTREAM_TAG', 'UPSTREAM_SHA', 'ADAPTER_SHA', 'GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT')}
          pathlib.Path(sys.argv[1], 'BUILD-PROVENANCE.json').write_text(json.dumps(provenance, indent=2) + '\n')
          PY

      - name: Upload the verified package
        id: package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: huashu-codex-package-${{ needs.discover.outputs.release }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/huashu-dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [discover, build]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Retrieve the package from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.package_id }}
          path: ${{ runner.temp }}/huashu-release

      - name: Publish the verified package
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.discover.outputs.tag }}
          UPSTREAM_SHA: ${{ needs.discover.outputs.upstream }}
          ADAPTER_SHA: ${{ needs.discover.outputs.adapter }}
          RELEASE_TAG: ${{ needs.discover.outputs.release }}
        working-directory: ${{ runner.temp }}/huashu-release
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          checksum = pathlib.Path('SHA256SUMS').read_text()
          match = re.fullmatch(r'([0-9a-f]{64})  huashu-design-codex\.zip\n', checksum)
          provenance = json.loads(pathlib.Path('BUILD-PROVENANCE.json').read_bytes())
          audit = json.loads(pathlib.Path('upstream-audit.json').read_bytes())
          if not match or hashlib.sha256(pathlib.Path('huashu-design-codex.zip').read_bytes()).hexdigest() != match[1]:
              raise SystemExit('The verified package checksum did not survive transfer.')
          for key in ('UPSTREAM_TAG', 'UPSTREAM_SHA', 'ADAPTER_SHA', 'GITHUB_SHA', 'GITHUB_RUN_ID'):
              if provenance.get(key.lower()) != os.environ[key]:
                  raise SystemExit(f'Package provenance differs at {key}.')
          # GitHub can rerun only the failed publish job using an earlier build from this run.
          attempt = provenance.get('github_run_attempt', '')
          if not re.fullmatch(r'[1-9][0-9]*', attempt) or int(attempt) > int(os.environ['GITHUB_RUN_ATTEMPT']):
              raise SystemExit('The package has an invalid build attempt.')
          if audit['status'] != 'ready' or audit['upstream'] != {'tag': os.environ['UPSTREAM_TAG'], 'commit': os.environ['UPSTREAM_SHA']}:
              raise SystemExit('The compatibility audit does not authorize this candidate.')
          tag = os.environ['UPSTREAM_TAG']
          adapter = os.environ['ADAPTER_SHA']
          run = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          pathlib.Path('release-notes.md').write_text(
              f'Upstream [{tag}](https://github.com/alchaincyf/huashu-design/releases/tag/{tag}) · `{os.environ["UPSTREAM_SHA"]}`\n\n'
              f'Codex source `{adapter}` · [Actions test report]({run})\n\n'
              'Download `huashu-design-codex.zip`, `SHA256SUMS` and `PACKAGE-MANIFEST.json`. '
              'The ZIP includes the Skill and the locked Node runtime manifests. '
              'The audit describes which upstream changes are included.\n',
              encoding='utf-8')
          PY
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$ADAPTER_SHA" \
            --title "Huashu Design Codex · $UPSTREAM_TAG (${ADAPTER_SHA:0:12})" --latest --notes-file release-notes.md \
            huashu-design-codex.zip SHA256SUMS PACKAGE-MANIFEST.json upstream-audit.json upstream-audit.md BUILD-PROVENANCE.json
          printf '\n[Download the verified Release](%s/%s/releases/tag/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
